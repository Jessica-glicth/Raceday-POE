name: CI - Build API + MVC and run tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore API solution
        run: dotnet restore Part2-RestfulApi/RaceDay.sln

      - name: Restore MVC project
        run: dotnet restore Part3-MvcApp/RaceDay.Mvc/RaceDay.Mvc.csproj

      - name: Build API solution
        run: dotnet build Part2-RestfulApi/RaceDay.sln --no-restore --configuration Release

      - name: Build MVC project
        run: dotnet build Part3-MvcApp/RaceDay.Mvc/RaceDay.Mvc.csproj --no-restore --configuration Release

      - name: Run API unit tests
        run: dotnet test Part2-RestfulApi/RaceDay.sln --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MVC Docker image
        run: docker build -t raceday-mvc Part3-MvcApp/RaceDay.Mvc

      - name: Build API Docker image
        run: docker build -t raceday-api Part2-RestfulApi/RaceDay.Api
